{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}
{% block page_title %}Page Not Found{% endblock %}
{% block content %}
<div class="container text-center py-5">
    <div class="display-1 text-primary fw-bold mb-3">404</div>
    <h3 class="fw-bold mb-2">Academic Record or Page Not Found</h3>
    <p class="text-muted mb-4">The page or resource you requested does not exist or has been moved.</p>

    </a>
</div>
{% endblock %}
