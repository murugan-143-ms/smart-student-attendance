{% extends "base.html" %}
{% block title %}500 Internal Error{% endblock %}
{% block page_title %}Internal Server Error{% endblock %}
{% block content %}
<div class="container text-center py-5">
    <div class="display-1 text-danger fw-bold mb-3">500</div>
    <h3 class="fw-bold mb-2">Internal Application Error</h3>
    <p class="text-muted mb-4">{{ error or "An unexpected database or server error occurred." }}</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-primary px-4">
        <i class="bi bi-arrow-counterclockwise me-1"></i> Reload Dashboard
    </a>
</div>
{% endblock %}
